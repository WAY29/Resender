name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build extension
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test

      - name: Typecheck
        run: npm run typecheck

      - name: Build extension
        run: npm run build

      - name: Package extension
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            package_name="resender-${GITHUB_REF_NAME}.zip"
          else
            package_name="resender-${GITHUB_RUN_NUMBER}.zip"
          fi

          cd dist
          zip -r "../${package_name}" .
          cd ..
          echo "PACKAGE_NAME=${package_name}" >> "${GITHUB_ENV}"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: resender-extension
          path: resender-*.zip

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" "${PACKAGE_NAME}" \
            --title "Resender ${GITHUB_REF_NAME}" \
            --notes "Chrome unpacked extension build for ${GITHUB_REF_NAME}."
